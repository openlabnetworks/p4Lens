name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8
        
    - name: Lint with flake8
      working-directory: ./backend
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        
    - name: Check formatting with black
      working-directory: ./backend
      run: black --check .
        
  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
      
    - name: Build
      working-directory: ./frontend
      run: npm run build
      
  docker:
    runs-on: ubuntu-latest
    continue-on-error: true  # Make docker job informational
    timeout-minutes: 25
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker images
      run: docker compose build || docker-compose build
        
    - name: Start stack
      run: docker compose up -d || docker-compose up -d
      
    - name: Wait for backend health
      run: |
        for i in {1..20}; do
          if docker compose exec -T backend curl -fsS http://localhost:8000/health >/dev/null; then
            exit 0
          fi
          sleep 5
        done
        echo "Backend never became healthy."
        docker compose logs backend || docker-compose logs backend || true
        exit 1
        
    - name: Stop stack
      if: always()
      run: docker compose down -v --remove-orphans || docker-compose down -v --remove-orphans
