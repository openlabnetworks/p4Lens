name: Backend build and deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - examples/basic_router.p4
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

concurrency:
  group: p4lens-backend-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/openlabnetworks/p4lens-backend
  DEPLOY_URL: https://api.sankalpjha.dev/__poolctl/api/deploy/p4lens
  HEALTH_URL: https://p4lens-api.sankalpjha.dev/health

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
          python parser_utils.py ../examples/basic_router.p4 >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy verified digest to Myprod
        env:
          DEPLOY_TOKEN: ${{ secrets.MYPROD_P4LENS_DEPLOY_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DEPLOY_TOKEN"
          test -n "$DIGEST"
          payload="$(jq -nc --arg image "$IMAGE@$DIGEST" '{image: $image}')"
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DEPLOY_URL"

      - name: Verify production health
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
